<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小智 · 配网</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#26303d;--fg:#e6edf3;--dim:#8b949e;--acc:#2f81f7;--ok:#3fb950;--err:#f85149}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px 16px 40px}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:8px 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .label{font-size:13px;color:var(--dim);margin-bottom:8px}
  .nets{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
  .net{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.15s}
  .net:active{transform:scale(.99)}
  .net.on{border-color:var(--acc);background:#1f6feb22}
  .net .n{font-weight:500;word-break:break-all}
  .net .r{color:var(--dim);font-size:12px;flex:none;margin-left:10px}
  input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0b0f14;color:var(--fg);font-size:16px;outline:none}
  input:focus{border-color:var(--acc)}
  .row{display:flex;gap:10px;margin-top:12px}
  .row input{flex:1}
  button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;margin-top:14px}
  button:disabled{opacity:.5}
  .ghost{background:#21262d;color:var(--fg);font-weight:500;font-size:14px;padding:10px;margin-top:10px}
  .status{margin-top:12px;font-size:14px;min-height:20px}
  .ok{color:var(--ok)}.err{color:var(--err)}
  .hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
  .code{font-family:ui-monospace,Menlo,monospace;letter-spacing:6px;text-align:center;font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>小智 · 配网</h1>
  <div class="sub">已连上设备热点（无需密码）· 选择办公室 WiFi，用手机键盘输密码</div>

  <div class="card">
    <div class="label">附近的 WiFi</div>
    <div class="nets" id="nets"><div class="label">正在扫描…</div></div>
    <button class="ghost" onclick="scan()">重新扫描</button>
    <div class="label" style="margin-top:16px">没扫到？手动输入 WiFi 名（需点右侧按钮生效）</div>
    <div class="row">
      <input id="manual" placeholder="例如 DYZN88" autocomplete="off" autocapitalize="off" autocorrect="off">
      <button class="ghost" style="width:auto;margin:0;padding:0 16px" onclick="useManual()">使用</button>
    </div>
  </div>

  <div class="card">
    <div class="label">WiFi 密码</div>
    <input id="pass" type="password" placeholder="输入密码" autocomplete="off" autocapitalize="off" autocorrect="off">
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--dim);font-size:14px">
      <input type="checkbox" id="show" style="width:auto;margin:0" onchange="pass.type=this.checked?'text':'password'"> 显示密码
    </label>
  </div>

  <div class="card">
    <div class="label">设备上的配对码（6 位数字）</div>
    <input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="······">
    <div class="hint">防止别人误配你的设备。看设备屏幕二维码下方那 6 个数字。</div>
  </div>

  <button id="go" onclick="save()">保存并连接</button>
  <div class="status" id="st"></div>

  <div class="hint">
    没自动弹出这页？用<b>手机相机</b>扫设备屏幕上的二维码，或在浏览器输入 <b>http://192.168.4.1</b>。<br>
    微信扫一扫可能打不开本地地址，请用系统相机或浏览器。<br>
    保存后手机可能提示“无互联网”，选“保持连接”，等设备变绿屏再切回。
  </div>
</div>

<script>
let picked = "";
const $ = id => document.getElementById(id);

async function scan(){
  const box = $("nets");
  box.innerHTML = '<div class="label">正在扫描…</div>';
  try{
    const r = await fetch("/scan", {cache:"no-store"});
    const list = await r.json();
    if(!list.length){ box.innerHTML = '<div class="label">没扫到网络，靠近路由器再试</div>'; return; }
    list.sort((a,b)=>b.rssi-a.rssi);
    box.innerHTML = "";
    list.forEach(n=>{
      const d = document.createElement("div");
      d.className = "net" + (n.ssid===picked ? " on" : "");
      d.innerHTML = `<span class="n"></span><span class="r">${n.rssi} dBm</span>`;
      d.querySelector(".n").textContent = n.ssid;
      d.onclick = ()=>{ picked = n.ssid; $("manual").value=""; document.querySelectorAll(".net").forEach(e=>e.classList.remove("on")); d.classList.add("on"); $("pass").focus(); };
      box.appendChild(d);
    });
  }catch(e){ box.innerHTML = '<div class="label">扫描失败，点下方重试</div>'; }
}

async function save(){
  if(!picked){ $("st").className="status err"; $("st").textContent="请先选择一个 WiFi"; return; }
  const pass = $("pass").value, code = $("code").value.trim();
  if(code.length!==6){ $("st").className="status err"; $("st").textContent="请输入屏幕上的 6 位配对码"; return; }
  $("go").disabled = true;
  $("st").className = "status"; $("st").textContent = "正在连接…";
  try{
    const body = new URLSearchParams({ssid:picked, pass, code});
    const r = await fetch("/save", {method:"POST", body});
    const j = await r.json();
    if(j.ok){ $("st").className="status ok"; $("st").textContent="配置成功，设备正在连接…"; poll(); }
    else { $("st").className="status err"; $("st").textContent = j.msg || "保存失败"; $("go").disabled=false; }
  }catch(e){ $("st").className="status err"; $("st").textContent="请求失败"; $("go").disabled=false; }
}

async function poll(){
  for(let i=0;i<40;i++){
    await new Promise(r=>setTimeout(r,1000));
    try{
      const j = await (await fetch("/status",{cache:"no-store"})).json();
      if(j.state==="connected"){ $("st").className="status ok"; $("st").textContent="已联网：" + j.ip; return; }
      if(j.state==="failed"){ $("st").className="status err"; $("st").textContent="连接失败，请检查密码（" + (j.err||"") + "）"; $("go").disabled=false; return; }
    }catch(e){}
  }
}
function useManual(){
  const v = $("manual").value.trim();
  if(!v){ $("st").className="status err"; $("st").textContent="请先输入 WiFi 名"; return; }
  picked = v;
  document.querySelectorAll(".net").forEach(x=>x.classList.remove("on"));
  $("st").className="status"; $("st").textContent="已选择手动名称：" + v;
}
scan();
</script>
</body>
</html>
